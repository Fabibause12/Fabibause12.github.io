name: Seiten aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'Pflanzen/**'
      - 'Bienen/**'
      - 'Werdegang/**'
      - 'tools/**'
      - 'index.html'
      - 'pflanzen.html'
      - 'bienen.html'
      - 'wuerfel.html'
      - 'impressum.html'
      - '.github/workflows/seiten-bauen.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seiten-bauen
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Bildwerkzeuge installieren
        run: pip install --quiet Pillow pillow-heif

      - name: Pflanzenliste erzeugen
        run: python tools/build_pflanzen.py

      - name: Bienenliste erzeugen
        run: python tools/build_bienen.py

      - name: Werdegang-Seite erzeugen
        run: python tools/build_werdegang.py

      - name: Englische Seiten und Sitemap erzeugen
        run: python tools/build_englisch.py

      - name: Änderungen committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Pflanzen Bienen werdegang.html ./*-en.html sitemap.xml
          if git diff --staged --quiet; then
            echo "Alles schon aktuell"
          else
            git commit -m "Seiten automatisch neu gebaut"
            git push
          fi
